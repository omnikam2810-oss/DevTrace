services:
  postgres:
    image: postgres:16-alpine
    container_name: devtrace-postgres
    environment:
      POSTGRES_DB: devtrace
      POSTGRES_USER: devtrace
      POSTGRES_PASSWORD: devtrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devtrace-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: devtrace-nginx
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/devtrace.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:

